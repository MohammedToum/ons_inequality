version: 2

models:
  - name: dim_data_marking
    description: >
      Dimension table of standardised ONS data marking codes and descriptions
      used to identify suppression and low-quality data.
    columns:
      - name: data_marking_sk
        description: Surrogate key generated from the data marking code.
        data_tests:
          - not_null
          - unique
      - name: data_marking_code
        description: ONS data marking code.
        data_tests:
          - not_null
          - unique
      - name: data_marking_reason
        data_tests:
          - not_null
      - name: is_suppressed
        description: Boolean flag indicating whether the observation value and confidence limits were suppressed due to an ONS data marking.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_low_quality
        description: Boolean flag indicating whether the observation value and confidence limits were marked as low quality due to an ONS data marking.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: data_marking_description
        data_tests:
          - not_null

  - name: fct_suicide_observations
    description: >
      SCD type 2 fact table for suicide observations from the ONS suicides in
      the UK dataset.
    columns:
      - name: suicide_observation_sk
        description: Surrogate key generated from the source observation key.
        data_tests:
          - not_null
      - name: source_observation_sk
        description: Observation surrogate key from the upstream staging model.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suicides_in_the_uk')
                field: observation_sk
      - name: observation_value
        data_tests:
          - not_null
      - name: time_period_sk
        description: Surrogate key to dim_time_periods for the observation period.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time_periods')
                field: time_period_sk
      - name: time_period_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - calendar_year
      - name: time_period_id
        description: Source period identifier for the observation.
        data_tests:
          - not_null
      - name: time_label
        data_tests:
          - not_null
      - name: calendar_year
        data_tests:
          - not_null
      - name: geography_sk
        description: Surrogate key to dim_geographies for the observation geography.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geographies')
                field: geography_sk
      - name: geography_code
        description: ONS geography code for the observation. Local authority rows use administrative geography codes; quarterly rows use the UK geography code.
        data_tests:
          - not_null
      - name: geography_name
        data_tests:
          - not_null
      - name: dbt_scd_id
        description: dbt snapshot SCD identifier for the observation version.
        data_tests:
          - not_null
          - unique
      - name: dbt_updated_at
        description: Timestamp when dbt last updated the snapshot row.
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: Timestamp from which the snapshot row is valid.
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: Timestamp until which the snapshot row is valid. Null for the latest version.
      - name: is_latest
        description: Boolean flag indicating whether the row is the latest snapshot version.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false

  - name: fct_wellbeing_observations
    description: >
      Fact table combining ONS wellbeing observations from the local authority
      and quarterly datasets into a single observation-level model.
    columns:
      - name: wellbeing_observation_sk
        description: Surrogate key generated from the source dataset and source observation key.
        data_tests:
          - not_null
      - name: source_dataset
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - wellbeing_local_authority
                  - wellbeing_quarterly
      - name: source_observation_sk
        description: Observation surrogate key from the upstream staging model.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_wellbeing_local_authority')
                field: observation_sk
              config:
                where: "source_dataset = 'wellbeing_local_authority'"
          - relationships:
              arguments:
                to: ref('stg_wellbeing_quarterly')
                field: observation_sk
              config:
                where: "source_dataset = 'wellbeing_quarterly'"
      - name: observation_value
        description: Numeric wellbeing observation value. Null when suppressed in the source data.
      - name: data_marking
        description: ONS data marking code where supplied by the source dataset.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_data_marking')
                field: data_marking_code
      - name: is_suppressed
        description: Boolean flag indicating whether the observation value is suppressed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_low_quality
        description: Boolean flag indicating whether the observation value is marked as low quality.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: lower_confidence_limit
        description: Lower confidence limit for the observation where supplied and not suppressed.
      - name: upper_confidence_limit
        description: Upper confidence limit for the observation where supplied and not suppressed.
      - name: time_period_sk
        description: Surrogate key to dim_time_periods for financial-year rows. Null for quarter rows.
        data_tests:
          - not_null:
              config:
                where: "time_period_type = 'financial_year'"
          - relationships:
              arguments:
                to: ref('dim_time_periods')
                field: time_period_sk
      - name: time_quarter_sk
        description: Surrogate key to dim_time_quarters for quarter rows. Null for financial-year rows.
        data_tests:
          - not_null:
              config:
                where: "time_period_type = 'quarter'"
          - relationships:
              arguments:
                to: ref('dim_time_quarters')
                field: time_quarter_sk
      - name: time_period_type
        description: Normalised time grain for the observation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - financial_year
                  - quarter
      - name: time_period_id
        description: Source period identifier, such as financial year or year-quarter.
        data_tests:
          - not_null
      - name: geography_code
        description: ONS geography code for the observation. Local authority rows use administrative geography codes; quarterly rows use the UK geography code.
        data_tests:
          - not_null
      - name: geography_sk
        description: Surrogate key to dim_geographies for the observation geography.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geographies')
                field: geography_sk
      - name: geography_name
        data_tests:
          - not_null
      - name: wellbeing_measure_code
        description: ONS wellbeing measure code where supplied by the source dataset.
        data_tests:
          - not_null
      - name: wellbeing_measure_name
        data_tests:
          - not_null
      - name: wellbeing_estimate_code
        description: ONS wellbeing estimate code where supplied by the source dataset.
        data_tests:
          - not_null
      - name: wellbeing_estimate_name
        data_tests:
          - not_null
      - name: seasonal_adjustment_code
        description: Seasonal adjustment code where supplied by the quarterly dataset.
        data_tests:
          - not_null
      - name: seasonal_adjustment_name
        data_tests:
          - not_null
