version: 2

models:
  - name: dim_local_authorities
    description: >
      Dimension table mapping local authorities to their corresponding ONS
      statistical regions.
    columns:
      - name: local_authority_sk
        description: Surrogate key generated from the local authority code.
        data_tests:
          - not_null
          - unique
      - name: local_authority_code
        description: Official ONS local authority code.
        data_tests:
          - not_null
          - unique
      - name: local_authority_name
        data_tests:
          - not_null
      - name: region_code
        description: Official ONS region code for the associated region.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - E12000001
                  - E12000002
                  - E12000003
                  - E12000004
                  - E12000005
                  - E12000006
                  - E12000007
                  - E12000008
                  - E12000009
                  - S92000003
                  - W92000004
                  - N92000002
      - name: region_name
        description: Official ONS region name for the associated region.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - North East
                  - North West
                  - Yorkshire and The Humber
                  - East Midlands
                  - West Midlands
                  - East of England
                  - London
                  - South East
                  - South West
                  - Scotland
                  - Wales
                  - Northern Ireland

  - name: dim_nations
    description: >
      Dimension table of UK nations and the United Kingdom geography used in
      ONS datasets.
    columns:
      - name: nation_sk
        description: Surrogate key generated from the nation code.
        data_tests:
          - not_null
          - unique
      - name: nation_code
        description: Official ONS nation or UK geography code.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - S92000003
                  - W92000004
                  - K02000001
                  - N92000002
                  - E92000001
      - name: nation_name
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Scotland
                  - Wales
                  - United Kingdom
                  - Northern Ireland
                  - England

  - name: dim_geographies
    description: >
      Unified geography dimension for ONS fact tables across local authority,
      region, nation, United Kingdom, and GDP NUTS geographies.
    columns:
      - name: geography_sk
        description: Surrogate key generated from the geography code.
        data_tests:
          - not_null
          - unique
      - name: geography_code
        description: Natural ONS or NUTS geography code used by source observations.
        data_tests:
          - not_null
          - unique
      - name: geography_name
        description: Human-readable geography name.
        data_tests:
          - not_null
      - name: geography_level
        description: Geography grain represented by the row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - local_authority
                  - region
                  - nation
                  - united_kingdom
                  - nuts_region
      - name: parent_region_code
        description: Parent region code where the geography sits below region level.
      - name: parent_region_name
        description: Parent region name where the geography sits below region level.
      - name: parent_nation_code
        description: Parent nation code where applicable.
      - name: parent_nation_name
        description: Parent nation name where applicable.
