version: 2

models:
  - name: dim_time_periods
    description: >
      Dimension table of canonical calendar-year and financial-year time
      periods used by ONS observation fact tables.
    columns:
      - name: time_period_sk
        description: Surrogate key generated from the time period type, start year, and end year.
        data_tests:
          - not_null
          - unique
      - name: time_period_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - calendar_year
                  - financial_year
      - name: time_period_label
        data_tests:
          - not_null
      - name: start_year
        data_tests:
          - not_null
      - name: end_year
        data_tests:
          - not_null
      - name: start_date
        data_tests:
          - not_null
      - name: end_date
        data_tests:
          - not_null
      - name: calendar_year
        description: Calendar year for calendar-year periods. Null for financial-year periods.
      - name: financial_year_sk
        description: Surrogate key generated from the financial year label, start year, and end year.
        data_tests:
          - not_null
      - name: financial_year_label
        description: Financial year label in the format 'YYYY/YYYY'. Null for calendar-year periods.
      - name: financial_year_start
      - name: financial_year_end

  - name: dim_time_quarters
    description: >
      Dimension table of canonical calendar quarters used by quarterly ONS
      observation fact tables.
    columns:
      - name: time_quarter_sk
        description: Surrogate key generated from calendar year and quarter.
        data_tests:
          - not_null
          - unique
      - name: quarter_id
        description: Canonical quarter identifier in the format YYYYqN.
        data_tests:
          - not_null
          - unique
      - name: quarter_label
        description: Human-readable quarter label in the format YYYY QN.
        data_tests:
          - not_null
      - name: calendar_year
        data_tests:
          - not_null
      - name: quarter
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                  - 4
                quote: false
      - name: quarter_start_date
        data_tests:
          - not_null
      - name: quarter_end_date
        data_tests:
          - not_null
