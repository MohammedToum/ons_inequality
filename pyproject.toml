[project]

name = "ons-inequality"
version = "0.1.0"
description = "A production-style Python data pipeline for querying and modelling ONS inequality data."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

dbt = [
    "sqlfluff>=4.1.0",
    "dbt-bigquery>=1.11.1"
]

gcp = [
    "google-cloud-bigquery>=3.41.0",
]

[project.scripts]
ons-inequality = "ons_inequality.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
