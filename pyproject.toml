[project]
name = "ons-inequality"
version = "0.1.0"
description = "A production-style Python data pipeline for querying and modelling ONS inequality data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.8",
    "dbt-duckdb>=1.10.1",
    "dbt-postgres>=1.10.0",
    "duckdb>=1.5.2",
    "google-cloud-bigquery>=3.41.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.2",
    "poetry>=2.4.0",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "selenium>=4.43.0",
    "sqlfluff>=4.1.0",
    "sqlparse>=0.5.5",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
